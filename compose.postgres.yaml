# Adds a PostgreSQL 18 next to the application:
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d
# Set DATABASE_URL=postgres://support_agent:<POSTGRES_PASSWORD>@postgres:5432/support_agent in .env.
# The database lives in the volume `postgres`; back it up (docs/deployment.md, Backups).

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: support_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: support_agent
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_agent -d support_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    depends_on:
      postgres:
        condition: service_healthy

  web:
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
