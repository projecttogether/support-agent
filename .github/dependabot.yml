# Version updates, one pull request per group: npm at the root every weekday,
# the rest weekly. A release is proposed once it has been out for seven days;
# security updates ignore the schedule and the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The types follow the Node.js major (engines in package.json).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports only the TypeScript versions in its peer
      # range (8.x: below 6.1), so npm refuses a newer major (ERESOLVE).
      # Upgrade TypeScript by hand once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # A new Node.js major goes together with engines in package.json.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      compose-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # A new PostgreSQL major also needs a data upgrade.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
